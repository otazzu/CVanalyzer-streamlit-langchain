[project]
name = "cvanalyzer"
version = "0.1.0"
description = "Sistema de Evaluación de CVs con IA"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "pydantic>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "python-dotenv>=1.0.0",
    "pypdf2>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "prompts", "services", "ui"]